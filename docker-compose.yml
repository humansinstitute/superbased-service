services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: superbased-service-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fluxbase
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fluxbase"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: superbased-service-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${STORAGE_S3_ACCESS_KEY:-superbased}
      MINIO_ROOT_PASSWORD: ${STORAGE_S3_SECRET_KEY:-superbased-secret}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  minio-init:
    image: minio/mc:latest
    container_name: superbased-service-minio-init
    depends_on:
      minio:
        condition: service_started
    environment:
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:-superbased}
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:-superbased-secret}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-superbased-storage}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$STORAGE_S3_ACCESS_KEY $$STORAGE_S3_SECRET_KEY; do
        echo 'waiting for minio...';
        sleep 2;
      done &&
      mc mb -p local/$$STORAGE_S3_BUCKET || true &&
      mc anonymous set none local/$$STORAGE_S3_BUCKET || true
      "
    restart: "no"

  superbased-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: superbased-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      POSTGRES_URL: ${POSTGRES_URL:-postgres://postgres:postgres@postgres:5432/fluxbase}
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 3080
      STORAGE_ENABLED: ${STORAGE_ENABLED:-true}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-http://minio:9000}
      STORAGE_S3_ENDPOINT_PUBLIC: ${STORAGE_S3_ENDPOINT_PUBLIC:-http://localhost:9000}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-us-east-1}
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:-superbased}
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:-superbased-secret}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-superbased-storage}
      STORAGE_S3_FORCE_PATH_STYLE: ${STORAGE_S3_FORCE_PATH_STYLE:-true}
      STORAGE_PRESIGN_UPLOAD_TTL_SECONDS: ${STORAGE_PRESIGN_UPLOAD_TTL_SECONDS:-900}
      STORAGE_PRESIGN_DOWNLOAD_TTL_SECONDS: ${STORAGE_PRESIGN_DOWNLOAD_TTL_SECONDS:-900}
      STORAGE_DEFAULT_TTL_SECONDS: ${STORAGE_DEFAULT_TTL_SECONDS:-2592000}
      STORAGE_DELETED_RETENTION_SECONDS: ${STORAGE_DELETED_RETENTION_SECONDS:-86400}
      STORAGE_MAX_OBJECT_BYTES: ${STORAGE_MAX_OBJECT_BYTES:-104857600}
      STORAGE_MAX_BYTES_PER_NPUB: ${STORAGE_MAX_BYTES_PER_NPUB:-1073741824}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3080:3080"

volumes:
  postgres_data:
  minio_data:
