services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: superbased-service-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fluxbase
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fluxbase"]
      interval: 5s
      timeout: 3s
      retries: 20

  superbased-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: superbased-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_URL: ${POSTGRES_URL:-postgres://postgres:postgres@postgres:5432/fluxbase}
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 3080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3080:3080"

volumes:
  postgres_data:
